project_name: Group_20_ETAI
seed: 42

data:
  train_path: data/raw/train.csv
  batch_path: data/raw/test.csv
  sample_submission_path: data/raw/sample_submission.csv
  customers_path: data/raw/clientes.csv
  use_customers: false
  id_column: ID
  customer_id_column: customer_id
  date_column: purchase_date
  classification_target: repeat_purchase_90d
  regression_target: spend_next_90d

cleaning:
  train_output_path: data/processed/train.csv
  test_output_path: data/processed/test.csv
  placeholder_tokens: [""]
  numeric_text_columns:
    - days_since_previous_purchase
    - prior_mean_purchase_value
    - prior_std_purchase_value
    - prior_min_purchase_value
    - prior_max_purchase_value
    - prior_mean_gap_days
    - prior_std_gap_days
    - spend_365d
  categorical_columns:
    - payment_type
    - salesperson
    - commercial_zone
    - transport_method
    - warehouse
    - document_series
  canonical_categories: {}
  validity_rules: {}
  redundant_columns: []
  # Remove training records with neither a timestamp nor any current purchase total.
  train_drop_if_all_missing:
    - purchase_date
    - Total a Pagar
    - Total Bruto
    - Total Liquido
  drop_exact_train_duplicates: true

outputs:
  model_dir: models
  output_dir: outputs
  classification_model: models/classification.joblib
  regression_model: models/regression.joblib
  kaggle_csv: outputs/kaggle_submission.csv
  spending_csv: outputs/spending_predictions.csv
  metrics_json: outputs/metrics.json

validation:
  test_size: 0.2
  # Confirm an appropriate split strategy after inspecting customer/time fields.
  strategy: null

classification:
  model: random_forest
  threshold: 0.5
  hyperparameters:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    class_weight: balanced
    n_jobs: -1

regression:
  model: random_forest
  hyperparameters:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    n_jobs: -1
